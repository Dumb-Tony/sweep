name: Publish After Hours
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check simulation and lifecycle
        run: |
          node tests/physics.cjs
          node tests/controls.cjs
          node tests/motion.cjs
          node tests/arcade.cjs
          node tests/arcade3d.cjs
          node tests/character.mjs
          node tests/tools.mjs
          node tests/mouse-look.mjs
          node --check prototypes/arcade3d/scene.js
          node --check prototypes/arcade3d/art.js
          node --check prototypes/arcade3d/tools.js
          node --check prototypes/arcade3d/character.js
          node --check prototypes/arcade3d/mouse-look.js
      - uses: actions/configure-pages@v5
      - name: Stage only the standalone game
        run: |
          mkdir -p _site
          cp -r prototypes/arcade3d/* _site/
          mkdir -p _site/flat
          cp prototypes/arcade/* _site/flat/
          mkdir -p _site/legacy
          cp prototypes/m1/index.html _site/legacy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
